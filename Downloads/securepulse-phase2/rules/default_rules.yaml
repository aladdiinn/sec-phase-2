rules:
- condition:
    field: description
    operator: contains
    value: sudo
  event_type: new_process
  message: Potential unauthorized sudo command execution
  mitre_tactic: Privilege Escalation
  mitre_technique: T1548.003
  name: Unauthorized Sudo Usage
  severity: critical
- condition:
    field: description
    operator: contains
    value: /etc/shadow
  event_type: file_change
  message: 'Critical system file modification detected: /etc/shadow'
  mitre_tactic: Credential Access
  mitre_technique: T1003.008
  name: Sensitive File Access
  severity: critical
- condition:
    field: description
    operator: contains
    value: user root
  event_type: ssh_login
  message: Root login attempt detected via SSH
  mitre_tactic: Initial Access
  mitre_technique: T1078
  name: SSH Root Login Attempt
  severity: critical
- condition:
    field: description
    operator: regex
    value: bash\s+-i\s+>&?\s+/dev/tcp
  event_type: new_process
  message: Potential reverse shell detected
  mitre_tactic: Execution
  mitre_technique: T1059.004
  name: Reverse Shell Pattern
  severity: critical
- condition:
    field: description
    operator: contains
    value: root
  event_type: new_process
  is_active: true
  message: Root-level command execution detected
  mitre_tactic: Privilege Escalation
  mitre_technique: T1548
  name: 'Test: Root Command Execution'
  severity: critical
- condition:
    field: description
    operator: contains
    value: /etc/shadow
  event_type: file_change
  is_active: true
  message: Sensitive file /etc/shadow accessed or modified
  mitre_tactic: Credential Access
  mitre_technique: T1003.008
  name: Sensitive File Access /etc/shadow
  severity: critical
- condition:
    field: description
    operator: regex
    value: nc\s+(-l|-lp|-lvp)
  event_type: new_process
  is_active: true
  message: Netcat listener started possible C2 channel
  mitre_tactic: Execution
  mitre_technique: T1059
  name: Netcat Listener Detected
  severity: critical
- condition:
    field: description
    operator: contains
    value: /etc/passwd
  event_type: file_change
  is_active: true
  message: /etc/passwd file was modified possible user account manipulation
  mitre_tactic: Persistence
  mitre_technique: T1136
  name: Passwd File Modified
  severity: critical
- condition:
    field: description
    operator: contains
    value: authorized_keys
  event_type: file_change
  is_active: true
  message: SSH authorized_keys file modified possible backdoor installation
  mitre_tactic: Persistence
  mitre_technique: T1098.004
  name: SSH Authorized Keys Modified
  severity: critical
- condition:
    field: description
    operator: contains
    value: /etc/cron
  event_type: cron_change
  is_active: true
  message: Crontab or cron directory modified possible persistence mechanism
  mitre_tactic: Persistence
  mitre_technique: T1053.005
  name: Crontab Modification
  severity: critical
- condition:
    field: description
    operator: contains
    value: SUID BIT PRIVILEGE ESCALATION
  event_type: file_change
  is_active: true
  message: SUID bit set on binary privilege escalation risk
  mitre_tactic: Privilege Escalation
  mitre_technique: T1548.001
  name: SUID Binary Created
  severity: critical
- condition:
    field: description
    operator: contains
    value: chmod +s
  event_type: new_process
  is_active: true
  message: SUID bit modification detected via chmod - possible privilege escalation
  mitre_tactic: Privilege Escalation
  mitre_technique: T1548.001
  name: SUID Bit Privilege Escalation (chmod)
  severity: critical
- condition:
    field: description
    operator: contains
    value: Failed pwd
  event_type: failed_login
  is_active: true
  message: Multiple failed password attempts detected
  mitre_tactic: Credential Access
  mitre_technique: T1110
  name: Failed Brute Force Pattern
  severity: critical
- condition:
    field: description
    operator: contains
    value: port_scan
  event_type: network_event
  is_active: true
  message: Port scanning activity detected from external source
  mitre_tactic: Discovery
  mitre_technique: T1046
  name: Port Scan Detected
  severity: critical
- condition:
    field: description
    operator: contains
    value: large_upload
  event_type: network_event
  is_active: true
  message: Large outbound file transfer detected possible data exfiltration
  mitre_tactic: Exfiltration
  mitre_technique: T1048
  name: Large File Transfer
  severity: critical
- condition:
    field: description
    operator: contains
    value: useradd
  event_type: new_process
  is_active: true
  message: New OS user account created verify if authorized
  mitre_tactic: Persistence
  mitre_technique: T1136.001
  name: New User Account Created
  severity: critical
- condition:
    field: description
    operator: contains
    value: apt-get install
  event_type: new_process
  is_active: true
  message: Software installation via apt-get detected outside maintenance window
  mitre_tactic: Execution
  mitre_technique: T1072
  name: Package Manager Unusual Usage
  severity: critical
- condition:
    field: description
    operator: contains
    value: service_stopped
  event_type: service_event
  is_active: true
  message: Critical service stopped unexpectedly possible impact or sabotage
  mitre_tactic: Impact
  mitre_technique: T1489
  name: Service Stopped Unexpectedly
  severity: critical
