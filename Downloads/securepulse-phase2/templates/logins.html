{% extends "base.html" %}
{% set active = 'logins' %}
{% block page_title %}Users & Logins{% endblock %}
{% block page_sub %}Track active users and login attempts{% endblock %}

{% block content %}
<div class="page fade-up">
    <div class="page-header">
        
    </div>

    <div class="card">
        <div class="filter-row">
            <div class="form-group">
                <label class="form-label">Search User</label>
                <input type="text" id="filter-user" class="form-input" placeholder="e.g. root" oninput="loadLogins()">
            </div>
            <div class="form-group">
                <label class="form-label">Event Type</label>
                <select id="filter-type" class="form-input" onchange="loadLogins()">
                    <option value="ssh_login,failed_login,logout">All login events</option>
                    <option value="ssh_login">Successful only</option>
                    <option value="failed_login">Failed only</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Time Range</label>
                <select id="filter-time" class="form-input" onchange="loadLogins()">
                    <option value="">All time</option>
                    <option value="1">Last 24h</option>
                    <option value="7">Last 7d</option>
                    <option value="30">Last 30d</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top:20px">
        <div id="logins-wrap">
            <div class="center-spinner">
                <div class="spinner"></div>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadLogins() {
        const user = document.getElementById('filter-user').value;
        const types = document.getElementById('filter-type').value;
        const days = document.getElementById('filter-time').value;
        const wrap = document.getElementById('logins-wrap');

        try {
            let url = `/api/events?event_type=${types}&limit=100`;
            if (days) url += `&days=${days}`;
            const data = await apiFetch(url);
            let items = data.items;
            
            if (user) {
                items = items.filter(e => {
                    const raw = typeof e.raw_data === 'string' ? JSON.parse(e.raw_data) : e.raw_data;
                    return raw.user && raw.user.toLowerCase().includes(user.toLowerCase());
                });
            }

            if (!items.length) {
                wrap.innerHTML = `
                    <div class="empty-state">
                        <p>No matching login events found</p>
                        <p style="font-size:13px; color:var(--text-muted); margin-top:8px">Events are sent by the SecurePulse agent on monitored servers</p>
                    </div>`;
                return;
            }

            wrap.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Server</th>
                            <th>User</th>
                            <th>Source IP</th>
                            <th>Status</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${items.map(e => {
                            const raw = typeof e.raw_data === 'string' ? JSON.parse(e.raw_data) : e.raw_data;
                            const isFailed = e.event_type === 'failed_login';
                            return `
                                <tr>
                                    <td class="mono" style="font-size:11px">${new Date(e.created_at).toLocaleString()}</td>
                                    <td><strong>${e.hostname}</strong></td>
                                    <td class="mono">${raw.user || '—'}</td>
                                    <td class="mono">${raw.ip || '—'}</td>
                                    <td>
                                        <span class="badge ${isFailed ? 'badge-red' : (e.event_type === 'logout' ? 'badge-gray' : 'badge-green')}">
                                            ${e.event_type.replace('_', ' ')}
                                        </span>
                                    </td>
                                    <td style="font-size:12px; color:var(--text-muted)">${e.description}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        } catch (e) { 
            console.error('Logins error:', e); 
            wrap.innerHTML = '<div class="empty-state"><p>Error loading data</p></div>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadLogins);
</script>
{% endblock %}
