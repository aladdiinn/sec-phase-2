{% extends "base.html" %}
{% set active = 'events' %}
{% block page_title %}Events{% endblock %}
{% block page_sub %}All security events logged by agents{% endblock %}

{% block content %}
<div class="page fade-up">
    <div class="page-header">
        
    </div>

    <!-- Filters -->
    <div class="card" style="margin-bottom:16px">
        <div class="filter-row">
            <div class="form-group">
                <label class="form-label">Event Type</label>
                <select id="filter-type" class="form-input" onchange="loadEvents()">
                    <option value="">All types</option>
                    <option value="login">login</option>
                    <option value="logout">logout</option>
                    <option value="ssh_login">ssh_login</option>
                    <option value="failed_login">failed_login</option>
                    <option value="cron_change">cron_change</option>
                    <option value="new_process">new_process</option>
                    <option value="process_ended">process_ended</option>
                    <option value="file_change">file_change</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Severity</label>
                <select id="filter-sev" class="form-input" onchange="loadEvents()">
                    <option value="">All</option>
                    <option value="info">info</option>
                    <option value="warning">warning</option>
                    <option value="critical">critical</option>
                </select>
            </div>
            <div class="form-group" style="align-self:flex-end">
                <button class="btn btn-ghost" onclick="loadEvents()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10" />
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                    </svg>
                    Refresh
                </button>
            </div>
        </div>
    </div>

    <div class="card">
        <div id="events-wrap">
            <div class="center-spinner">
                <div class="spinner"></div>
            </div>
        </div>
        <div id="events-pagination" style="display:flex;justify-content:flex-end;gap:8px;padding:12px 0 4px"></div>
    </div>
</div>

<script>
    let currentOffset = 0;
    const PAGE_SIZE = 50;

    function severityBadge(s) {
        const map = { info: 'badge-blue', warning: 'badge-yellow', critical: 'badge-red' };
        return `<span class="badge ${map[s] || 'badge-gray'}">${s}</span>`;
    }

    async function loadEvents() {
        currentOffset = 0;
        fetchEvents();
    }

    // Check URL params for filters (from servers page)
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        if (params.has('server_id')) {
            window._filter_server_id = params.get('server_id');
        }
        loadEvents();
    });

    async function fetchEvents() {
        const wrap = document.getElementById('events-wrap');
        const type = document.getElementById('filter-type').value;
        const sev = document.getElementById('filter-sev').value;

        let url = `/api/events?limit=${PAGE_SIZE}&offset=${currentOffset}`;
        if (type) url += `&event_type=${type}`;
        if (sev)  url += `&severity=${sev}`;
        if (window._filter_server_id) url += `&server_id=${window._filter_server_id}`;

        wrap.innerHTML = '<div class="center-spinner"><div class="spinner"></div></div>';

        try {
            const data = await apiFetch(url);
            if (!data.items.length) {
                wrap.innerHTML = '<div class="empty-state"><p>No events found with these filters.</p></div>';
                document.getElementById('events-pagination').innerHTML = '';
                return;
            }

            wrap.innerHTML = `
        <table class="data-table">
          <thead><tr>
            <th>Time</th><th>Server</th><th>Type</th>
            <th>Severity</th><th>Source</th><th>Description</th>
          </tr></thead>
          <tbody>
            ${data.items.map(e => `
              <tr>
                <td class="text-meta" style="white-space:nowrap">${new Date(e.created_at).toLocaleString()}</td>
                <td><strong>${e.hostname}</strong></td>
                <td><span class="text-meta">${e.event_type}</span></td>
                <td>${severityBadge(e.severity)}</td>
                <td class="text-sub">${e.source || '—'}</td>
                <td class="text-sub" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${e.description}">${e.description}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;

            // Pagination
            const total = data.total;
            const pages = Math.ceil(total / PAGE_SIZE);
            const currentPage = Math.floor(currentOffset / PAGE_SIZE);
            let pag = `<span style="color:var(--text-muted);font-size:12px;align-self:center">${total} total</span>`;
            if (currentOffset > 0) {
                pag += `<button class="btn btn-ghost" onclick="currentOffset-=${PAGE_SIZE};fetchEvents()">← Prev</button>`;
            }
            if (currentOffset + PAGE_SIZE < total) {
                pag += `<button class="btn btn-ghost" onclick="currentOffset+=${PAGE_SIZE};fetchEvents()">Next →</button>`;
            }
            document.getElementById('events-pagination').innerHTML = pag;

        } catch (e) {
            wrap.innerHTML = `<div class="empty-state"><p>Failed to load: ${e.message}</p></div>`;
        }
    }

    // Live push
    if (window._socket) {
        window._socket.on('new_event', () => fetchEvents());
    }

    setInterval(loadEvents, 15000);
</script>
{% endblock %}
