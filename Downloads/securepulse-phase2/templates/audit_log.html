{% extends "base.html" %}
{% set active = 'audit_log' %}
{% block page_title %}Audit Log{% endblock %}
{% block page_sub %}Immutable record of all admin actions for compliance{% endblock %}

{% block content %}
<div class="page fade-up">
    

    <div class="card">
        <div id="audit-wrap">
            <div class="center-spinner">
                <div class="spinner"></div>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadAuditLog() {
        const wrap = document.getElementById('audit-wrap');
        try {
            const data = await apiFetch('/api/audit-logs');
            if (!data.items || !data.items.length) {
                wrap.innerHTML = '<div class="empty-state"><p>No audit records found</p></div>';
                return;
            }

            wrap.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Admin</th>
                            <th>Action</th>
                            <th>Target</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.items.map(l => `
                            <tr>
                                <td class="mono" style="font-size:11px">${new Date(l.timestamp).toLocaleString()}</td>
                                <td><strong>${l.user_email}</strong></td>
                                <td><span class="badge badge-blue">${l.action}</span></td>
                                <td class="mono" style="font-size:12px; color:var(--text-secondary)">${l.target || '—'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        } catch (e) { 
            console.error('Audit log error:', e); 
            wrap.innerHTML = '<div class="empty-state"><p>Error loading data</p></div>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadAuditLog);
</script>
{% endblock %}
