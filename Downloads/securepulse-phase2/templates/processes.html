{% extends "base.html" %}
{% set active = 'processes' %}
{% block page_title %}Processes{% endblock %}
{% block page_sub %}Monitor newly spawned processes{% endblock %}

{% block content %}
<div class="page fade-up">
    <div class="page-header">
        
    </div>

    <div class="card">
        <div class="filter-row">
            <div class="form-group">
                <label class="form-label">Search Binary / Cmd</label>
                <input type="text" id="filter-cmd" class="form-input" placeholder="e.g. python" oninput="loadProcesses()">
            </div>
            <div class="form-group">
                <label class="form-label">User</label>
                <select id="filter-user" class="form-input" onchange="loadProcesses()">
                    <option value="">All users</option>
                    <option value="root">root only</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top:20px">
        <div id="processes-wrap">
            <div class="center-spinner">
                <div class="spinner"></div>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadProcesses() {
        const cmd = document.getElementById('filter-cmd').value;
        const user = document.getElementById('filter-user').value;
        const wrap = document.getElementById('processes-wrap');

        try {
            const data = await apiFetch(`/api/events?event_type=new_process&limit=100`);
            let items = data.items;

            if (cmd) {
                items = items.filter(e => e.description.toLowerCase().includes(cmd.toLowerCase()));
            }
            if (user) {
                items = items.filter(e => {
                    const raw = typeof e.raw_data === 'string' ? JSON.parse(e.raw_data) : e.raw_data;
                    return raw.username === user;
                });
            }

            if (!items.length) {
                wrap.innerHTML = '<div class="empty-state"><p>No processes matched your filters</p></div>';
                return;
            }

            wrap.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Detected At</th>
                            <th>Server</th>
                            <th>User</th>
                            <th>PID</th>
                            <th>Binary / Name</th>
                            <th>Command Line</th>
                            <th style="text-align:right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${items.map(e => {
                            const raw = typeof e.raw_data === 'string' ? JSON.parse(e.raw_data) : e.raw_data;
                            const isRoot = raw.username === 'root';
                            return `
                                <tr style="${isRoot ? 'background: rgba(239,68,68,0.06)' : ''}">
                                    <td class="mono" style="font-size:11px">${new Date(e.created_at).toLocaleString()}</td>
                                    <td><strong>${e.hostname}</strong></td>
                                    <td>
                                        ${isRoot ? '<span class="badge badge-red">ROOT</span>' : '<span class="badge badge-gray">' + raw.username + '</span>'}
                                    </td>
                                    <td class="mono">${raw.pid}</td>
                                    <td class="mono" style="font-weight:600; color:var(--text-primary)">${raw.name}</td>
                                    <td class="mono" style="font-size:11px; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap" title="${raw.cmdline}">
                                        ${raw.cmdline}
                                    </td>
                                    <td style="text-align:right">
                                        <button class="btn btn-ghost" style="padding:4px 8px; font-size:11px" onclick="alert('Trusted flag set!')">Trusted</button>
                                        <button class="btn btn-danger" style="padding:4px 8px; font-size:11px" onclick="alert('Process flagged!')">Flag</button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        } catch (e) { 
            console.error('Process error:', e); 
            wrap.innerHTML = '<div class="empty-state"><p>Error loading data</p></div>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadProcesses);
</script>
{% endblock %}
